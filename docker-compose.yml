# Corporate parity stack. Activates with C4 — not started by default CI.
# parity-live currently runs the mock tier only.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: demiurge
      POSTGRES_PASSWORD: demiurge
      POSTGRES_DB: demiurge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demiurge"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["corporate"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles: ["corporate"]

  collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    profiles: ["corporate"]
