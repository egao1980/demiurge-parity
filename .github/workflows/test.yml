name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DEMIURGE_PARITY_TIER: mock

jobs:
  test:
    uses: egao1980/cl-repository/.github/workflows/test-system.yml@main

  parity-live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEMIURGE_PARITY_TIER: live-corporate
      DEMIURGE_CORPORATE__POSTGRES__DSN: postgres://demiurge:demiurge@127.0.0.1:5432/demiurge
    steps:
      - uses: actions/checkout@v5
      - name: Start compose
        run: docker compose --profile corporate up --wait --wait-timeout 180
      - name: Compose ready
        run: docker compose ps
      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          system: demiurge-parity
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
          system: demiurge-parity
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Compose down
        if: always()
        run: docker compose down -v
