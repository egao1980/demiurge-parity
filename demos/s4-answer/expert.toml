[expert]
name = "s4-answer"
description = "S4 answer demo — echo expert over the HTML fixture."
catalogue = "world"

[llm]
default-model = "mock"

[[corpus]]
kind = "file"
spec = "corpus"
pattern = "*.html"
store = "memory"

[[ks]]
name = "echo"
watch = "(:prompt)"
prompt-key = "prompt"
result-key = "result"
instructions = "Echo the user. Cite fixture block ids when present."
