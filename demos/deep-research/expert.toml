[expert]
name = "research-demo"
description = "Deep-research demo expert (nvidia/nemotron-3-nano-omni). LLM + websearch backends come from this file."
catalogue = "world"

[profile]
kind = "personal"

[profile.paths]
data-dir = "/tmp/demiurge-demo-deep-research"

[llm]
default-model = "lmstudio"

[[llm.catalog]]
name = "lmstudio"
kind = "openai-compat"
base-url = "http://127.0.0.1:1234/v1"
model = "qwen/qwen3.8-27b"
api-key-env = "LM_API_TOKEN"

[[llm.catalog]]
name = "mock"
kind = "mock"

[workspace]
root = "../../"

[websearch]
kind = "searxng"
base-url = "http://127.0.0.1:8888"
fixtures = "websearch.toml"

[[ks]]
name = "echo"
watch = "(:prompt)"
prompt-key = "prompt"
result-key = "result"
instructions = "You are a Common Lisp / cl-stack expert. Cite sources. Do not guess."
