[expert]
name = "s6-improve"
description = "S6 improve demo — echo expert with a no-critical-regression gate."
catalogue = "world"

[llm]
default-model = "mock"

[[ks]]
name = "echo"
watch = "(:prompt)"
prompt-key = "prompt"
result-key = "result"
instructions = "Echo the user."

[[eval]]
name = "s6-improve"
gate = "no-critical-regression"

[improve]
enabled = true
hitl = false
